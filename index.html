<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/icon-192.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile App Meta Tags -->
    <title>ReWear — Fabric Waste Reuse</title>
    <meta name="description" content="Show us your leftover fabric. We show you what to make, how it will look, and exactly how to stitch it." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#065f46" />
    
    <!-- iOS / Safari Home Screen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReWear" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    
    <!-- Android / Chrome Theme -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ReWear" />
  </head>
  <body class="bg-stone-900 text-stone-900 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for Mobile PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('ServiceWorker registered:', reg.scope))
            .catch((err) => console.warn('ServiceWorker registration notice:', err));
        });
      }
    </script>
  </body>
</html>
